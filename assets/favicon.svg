<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- App background -->
    <rect width="64" height="64" rx="15" fill="#0f172a" />

    <!-- Artwork / packaging document -->
    <path d="M17 11h22l10 10v27
       a5 5 0 0 1-5 5H17
       a5 5 0 0 1-5-5V16
       a5 5 0 0 1 5-5z" fill="#ffffff" />

    <!-- Folded artwork corner -->
    <path d="M39 11v8
       a3 3 0 0 0 3 3h7z" fill="#f59e0b" />

    <!-- Copy / text lines -->
    <rect x="20" y="25" width="18" height="3.5" rx="1.75" fill="#94a3b8" />

    <rect x="20" y="32" width="14" height="3.5" rx="1.75" fill="#cbd5e1" />

    <!-- Artwork crop / marker -->
    <rect x="20" y="40" width="10" height="7" rx="2" fill="#f59e0b" />

    <!-- Approval badge -->
    <circle cx="45" cy="45" r="11" fill="#059669" stroke="#0f172a" stroke-width="3" />

    <!-- Check -->
    <path d="M40.5 45
       l3 3
       6-7" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>